                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                >

                <button type="submit">Entrar</button>

            </form>

            <p class="cadastro">
                Ainda não possui uma conta?
                <a href="index.html">Cadastre-se</a>
            </p>

        </div>

    </div>

</body>
